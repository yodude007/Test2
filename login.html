<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - REUNIFIED SERVICES</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; background: url("background.jpg") no-repeat center center/cover; }

    .login-container {
      display: flex; flex-direction: column; gap: 15px;
      width: 90%; max-width: 350px;
      padding: 20px; background: rgba(211,211,211,0.85);
      border-radius: 10px; text-align: center;
    }

    input[type="email"], input[type="password"] {
      width: 100%; padding: 12px; border-radius: 5px; border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      padding: 12px; border: none; border-radius: 10px;
      background-color: #4CAF50; color: white;
      font-size: 16px; cursor: pointer;
    }

    button:hover { background-color: #45a049; }

    .forgot-password {
      font-size: 14px; color: blue; cursor: pointer;
      text-decoration: underline; margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="login-container" id="loginContainer">
    <h2>Login</h2>
    <input type="email" id="email" placeholder="REUNIFIED SERVICES EMAIL">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <div class="forgot-password" id="forgotBtn">Forgot Password?</div>
  </div>

  <script>
    // Login logic for testing
    document.getElementById("loginBtn").addEventListener("click", () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if(email === "r@reunifiedservice.com" && password === "test"){
        window.location.href = "appbuttons.html";
      } else {
        alert("Invalid email or password.");
      }
    });

    // Forgot password logic - opens email app
    document.getElementById("forgotBtn").addEventListener("click", () => {
      const userEmail = prompt("ENTER REUNIFIED SERVICES EMAIL HERE");
      if(userEmail) {
        const adminEmail = "rtek13@gmail.com";
        const subject = encodeURIComponent("Password Reset Request");
        const body = encodeURIComponent(`User ${userEmail} has requested a password reset.`);

        // Open email app
        window.location.href = `mailto:${adminEmail}?subject=${subject}&body=${body}`;

        // Show popup
        alert("REUNIFIED SERVICE HAS BEEN NOTIFIED OF PASSWORD RESET REQUEST");
      }
    });
  </script>
</body>
</html>
